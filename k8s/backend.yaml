apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: shop-v2

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
      - name: backend

        image: sammybaransi537/shop-v2-backend:latest


        ports:
        - containerPort: 5001

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: shop-v2

spec:
  selector:
    app: backend

  ports:
  - port: 5001
    targetPort: 5001
