apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: shop-v2

spec:
  replicas: 1

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
      - name: frontend

        image: sammybaransi537/shop-v2-frontend:latest

        ports:
        - containerPort: 5173

---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: shop-v2

spec:
  selector:
    app: frontend

  ports:
  - port: 5173
    targetPort: 5173
